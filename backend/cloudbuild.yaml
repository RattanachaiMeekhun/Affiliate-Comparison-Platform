steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '--tag', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}', '.', '--network=cloudbuild']
  env:
    - 'DOCKER_BUILDKIT=1'
images:
- 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'
  env:
    - 'DOCKER_BUILDKIT=1'
substitutions:
  _SERVICE_NAME: 'stacknodes-backend'

